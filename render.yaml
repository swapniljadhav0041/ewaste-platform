services:
  - type: web
    name: voltcycle-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://ewaste-platform.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FIRST_SUBMISSION_BONUS
        value: 50
      - key: BULK_THRESHOLD
        value: 10
      - key: BULK_BONUS_PERCENT
        value: 10
      - key: REFERRAL_BONUS
        value: 25
      - key: DATABASE_URL
        fromDatabase:
          name: voltcycle-db
          property: connectionString

databases:
  - name: voltcycle-db
    databaseName: voltcycle_db
    user: voltcycle_user
    plan: free
    region: oregon
